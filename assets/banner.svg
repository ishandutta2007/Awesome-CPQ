<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>

    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .radar-sweep {
        transform-origin: 1020px 190px;
        animation: radarRotate 8s linear infinite;
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .pulse-ring {
        transform-origin: 1020px 190px;
        animation: pulseRing 3s ease-out infinite;
      }
      .pulse-ring-delay {
        transform-origin: 1020px 190px;
        animation: pulseRing 3s ease-out 1.5s infinite;
      }
      @keyframes pulseRing {
        0% { r: 15; opacity: 0.8; stroke-width: 2; }
        50% { opacity: 0.4; stroke-width: 1.5; }
        100% { r: 120; opacity: 0; stroke-width: 0.5; }
      }

      .flight-path {
        stroke-dasharray: 8 6;
        animation: flightTrail 25s linear infinite;
      }
      @keyframes flightTrail {
        to { stroke-dashoffset: -200; }
      }

      .animated-plane {
        offset-path: path("M 80,310 C 280,240 450,290 680,180 S 960,140 1020,190");
        animation: flyRoute 12s ease-in-out infinite alternate;
      }
      @keyframes flyRoute {
        0% { offset-distance: 0%; opacity: 0.2; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0.9; }
      }

      .shimmer-text {
        animation: titleGlow 4s ease-in-out infinite alternate;
      }
      @keyframes titleGlow {
        0% { filter: drop-shadow(0 0 2px rgba(79,172,254,0.4)); }
        100% { filter: drop-shadow(0 0 12px rgba(0,242,254,0.9)); }
      }

      .hud-blink {
        animation: hudBlink 2s ease-in-out infinite alternate;
      }
      @keyframes hudBlink {
        0% { opacity: 0.3; }
        100% { opacity: 0.9; }
      }

      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }
      @keyframes badgePulse {
        0% { stroke-opacity: 0.3; }
        100% { stroke-opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Border Frame -->
  <rect x="2" y="2" width="1196" height="376" rx="15" fill="none" stroke="#1f4068" stroke-width="1.5" opacity="0.6"/>
  <rect x="8" y="8" width="1184" height="364" rx="12" fill="none" stroke="#00f2fe" stroke-width="0.75" opacity="0.25"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="720" y1="0" x2="720" y2="380"/>
    <line x1="840" y1="0" x2="840" y2="380"/>
    <line x1="960" y1="0" x2="960" y2="380"/>
    <line x1="1080" y1="0" x2="1080" y2="380"/>
  </g>

  <!-- Flight Path Wave Curves -->
  <path d="M 80,310 C 280,240 450,290 680,180 S 960,140 1020,190" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.45" class="flight-path"/>
  <path d="M 80,310 C 280,240 450,290 680,180 S 960,140 1020,190" fill="none" stroke="#4facfe" stroke-width="6" opacity="0.15" filter="url(#glow)"/>

  <!-- Secondary Waypoint Track -->
  <path d="M 120,330 C 350,290 520,330 760,230 S 1000,100 1120,120" fill="none" stroke="#64ffda" stroke-width="1.2" opacity="0.25" stroke-dasharray="4 4"/>

  <!-- Radar HUD Station (Right Side) -->
  <g transform="translate(0, 0)">
    <!-- Concentric Radar Rings -->
    <circle cx="1020" cy="190" r="130" fill="none" stroke="#1f4068" stroke-width="1" opacity="0.4"/>
    <circle cx="1020" cy="190" r="95" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3" stroke-dasharray="5 3"/>
    <circle cx="1020" cy="190" r="60" fill="none" stroke="#4facfe" stroke-width="1" opacity="0.4"/>
    <circle cx="1020" cy="190" r="25" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.5"/>
    <circle cx="1020" cy="190" r="4" fill="#00f2fe" filter="url(#subtleGlow)"/>

    <!-- Animated Radar Pulse Rings -->
    <circle cx="1020" cy="190" r="15" fill="none" stroke="#00f2fe" class="pulse-ring"/>
    <circle cx="1020" cy="190" r="15" fill="none" stroke="#64ffda" class="pulse-ring-delay"/>

    <!-- Radar Crosshairs -->
    <line x1="880" y1="190" x2="1160" y2="190" stroke="#00f2fe" stroke-width="1" opacity="0.25"/>
    <line x1="1020" y1="50" x2="1020" y2="330" stroke="#00f2fe" stroke-width="1" opacity="0.25"/>

    <!-- Rotating Radar Scanner Beam -->
    <g class="radar-sweep">
      <path d="M 1020,190 L 1150,150 A 130 130 0 0 0 1020,60 Z" fill="url(#accentGrad)" opacity="0.12"/>
      <line x1="1020" y1="190" x2="1150" y2="150" stroke="#00f2fe" stroke-width="2" opacity="0.8" filter="url(#subtleGlow)"/>
    </g>

    <!-- Waypoint / Blip Targets -->
    <g class="hud-blink">
      <circle cx="970" cy="140" r="3.5" fill="#38ef7d" filter="url(#subtleGlow)"/>
      <text x="980" y="144" fill="#38ef7d" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold">ATO-01</text>
      
      <circle cx="1080" cy="230" r="3.5" fill="#f6d365" filter="url(#subtleGlow)"/>
      <text x="1090" y="234" fill="#f6d365" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold">CBTA-OK</text>
      
      <circle cx="1045" cy="115" r="3" fill="#00f2fe"/>
      <text x="1055" y="119" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">EBT-SYNC</text>
    </g>
  </g>

  <!-- Animated Jet Icon traversing the flight path -->
  <g class="animated-plane">
    <!-- Airplane Symbol -->
    <path d="M 0,-10 L 4,-3 L 14,0 L 4,3 L 0,10 L -2,4 L -8,6 L -6,2 L -10,0 L -6,-2 L -8,-6 L -2,-4 Z" fill="url(#planeGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.6" stroke-dasharray="3 3"/>
  </g>

  <!-- Left Header & Branding Area -->
  <g transform="translate(60, 48)">
    <!-- Top Category Pill / Biscuit -->
    <g class="badge-glow">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#0c2340" stroke="#00f2fe" stroke-width="1.2" opacity="0.9"/>
      <circle cx="14" cy="14" r="4" fill="#00f2fe" filter="url(#subtleGlow)"/>
      <text x="26" y="18" fill="#64ffda" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">AVIATION EDTECH &amp; TMS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 72)" class="shimmer-text">
      <text x="0" y="0" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Awesome Crew Training</text>
      <text x="0" y="44" fill="url(#accentGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Management ✈️</text>
    </g>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="152" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14.5" font-weight="400">
      Curated index of SaaS platforms &amp; open-source Electronic Training Records (ETR),
    </text>
    <text x="0" y="174" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14" font-weight="500">
      CBTA / EBT qualification tracking, pilot logbooks, compliance &amp; flight school LMS.
    </text>

    <!-- Feature Pillars / Key Badges -->
    <g transform="translate(0, 205)">
      <!-- Badge 1: CBTA / EBT -->
      <g>
        <rect x="0" y="0" width="130" height="26" rx="6" fill="#112240" stroke="#233554" stroke-width="1"/>
        <text x="12" y="17" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎯 CBTA / EBT Ready</text>
      </g>

      <!-- Badge 2: EASA & FAA -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="145" height="26" rx="6" fill="#112240" stroke="#233554" stroke-width="1"/>
        <text x="12" y="17" fill="#64ffda" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🛡️ EASA / FAA Compliant</text>
      </g>

      <!-- Badge 3: Electronic Training Records -->
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="175" height="26" rx="6" fill="#112240" stroke="#233554" stroke-width="1"/>
        <text x="12" y="17" fill="#f6d365" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📋 Electronic Training Records</text>
      </g>

      <!-- Badge 4: Open Source & SaaS -->
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="150" height="26" rx="6" fill="#112240" stroke="#233554" stroke-width="1"/>
        <text x="12" y="17" fill="#ff7b72" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ SaaS &amp; Open-Source</text>
      </g>
    </g>
  </g>

  <!-- Corner HUD Tech Accents -->
  <g stroke="#00f2fe" stroke-width="1.5" opacity="0.6" fill="none">
    <path d="M 20,35 L 20,20 L 35,20"/>
    <path d="M 1180,35 L 1180,20 L 1165,20"/>
    <path d="M 20,345 L 20,360 L 35,360"/>
    <path d="M 1180,345 L 1180,360 L 1165,360"/>
  </g>
</svg>
