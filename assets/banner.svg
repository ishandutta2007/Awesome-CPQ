<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="45%" stop-color="#0c152b"/>
      <stop offset="85%" stop-color="#081026"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Accent Title Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="nodeGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="nodeGradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="nodeGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="nodeGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseRing {
        0% { r: 12px; opacity: 0.8; }
        50% { r: 28px; opacity: 0.15; }
        100% { r: 12px; opacity: 0.8; }
      }
      @keyframes pulseRingSecondary {
        0% { r: 8px; opacity: 0.7; }
        50% { r: 22px; opacity: 0.1; }
        100% { r: 8px; opacity: 0.7; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes dashFlowReverse {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 60; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes blinkGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 8px #38bdf8); }
        50% { opacity: 0.4; filter: drop-shadow(0 0 2px #38bdf8); }
      }
      @keyframes packetTravel1 {
        0% { cx: 860; cy: 190; opacity: 1; }
        100% { cx: 1010; cy: 120; opacity: 0.2; }
      }
      @keyframes packetTravel2 {
        0% { cx: 1010; cy: 120; opacity: 1; }
        100% { cx: 1110; cy: 220; opacity: 0.2; }
      }
      @keyframes packetTravel3 {
        0% { cx: 860; cy: 190; opacity: 1; }
        100% { cx: 960; cy: 290; opacity: 0.2; }
      }

      .pulse-ring-1 { animation: pulseRing 3.5s ease-in-out infinite; transform-origin: 860px 190px; }
      .pulse-ring-2 { animation: pulseRingSecondary 4s ease-in-out infinite; transform-origin: 1010px 120px; }
      .pulse-ring-3 { animation: pulseRingSecondary 3s ease-in-out infinite; transform-origin: 960px 290px; }
      .dash-edge-1 { stroke-dasharray: 6 4; animation: dashFlow 2.5s linear infinite; }
      .dash-edge-2 { stroke-dasharray: 5 3; animation: dashFlowReverse 3s linear infinite; }
      .radar-sweep-anim { animation: radarSweep 10s linear infinite; transform-origin: 860px 190px; }
      .float-group { animation: floatSlow 5s ease-in-out infinite; }
      .badge-pulsing { animation: blinkGlow 3s ease-in-out infinite; }
      .packet-1 { animation: packetTravel1 2s linear infinite; }
      .packet-2 { animation: packetTravel2 2.5s linear infinite; }
      .packet-3 { animation: packetTravel3 1.8s linear infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Outer Card Borders -->
  <rect x="2" y="2" width="1196" height="376" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.7"/>
  <rect x="8" y="8" width="1184" height="364" rx="12" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.25"/>

  <!-- Background Tech Coordinate Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="720" y1="0" x2="720" y2="380"/>
    <line x1="840" y1="0" x2="840" y2="380"/>
    <line x1="960" y1="0" x2="960" y2="380"/>
    <line x1="1080" y1="0" x2="1080" y2="380"/>
  </g>

  <!-- Identity Resolution Graph (Right Side) -->
  <g class="float-group">
    <!-- Radar Scanner Rings around Golden Record Center (860, 190) -->
    <circle cx="860" cy="190" r="140" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    <circle cx="860" cy="190" r="100" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" stroke-dasharray="6 4"/>
    <circle cx="860" cy="190" r="60" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    
    <!-- Rotating Scanner Beam -->
    <g class="radar-sweep-anim">
      <path d="M 860,190 L 990,140 A 140 140 0 0 0 860,50 Z" fill="url(#scanGrad)"/>
      <line x1="860" y1="190" x2="990" y2="140" stroke="#38bdf8" stroke-width="1.8" opacity="0.8" filter="url(#subtleGlow)"/>
    </g>

    <!-- Graph Connecting Edges (Matching Links) -->
    <!-- Center to Top-Right (MAID / Mobile Device) -->
    <line x1="860" y1="190" x2="1010" y2="120" stroke="#38bdf8" stroke-width="2" opacity="0.6" class="dash-edge-1"/>
    <line x1="860" y1="190" x2="1010" y2="120" stroke="#38bdf8" stroke-width="6" opacity="0.1" filter="url(#glow)"/>

    <!-- Center to Bottom-Right (Email / PII Hash) -->
    <line x1="860" y1="190" x2="960" y2="290" stroke="#818cf8" stroke-width="2" opacity="0.6" class="dash-edge-2"/>

    <!-- Center to Far-Right Center (Unified Profile ID) -->
    <line x1="860" y1="190" x2="1110" y2="220" stroke="#34d399" stroke-width="1.8" opacity="0.5" class="dash-edge-1"/>

    <!-- Center to Top-Left (Cookie ID / Web) -->
    <line x1="860" y1="190" x2="740" y2="100" stroke="#fbbf24" stroke-width="1.8" opacity="0.5" class="dash-edge-2"/>

    <!-- Center to Bottom-Left (IP / Household Graph) -->
    <line x1="860" y1="190" x2="760" y2="280" stroke="#c084fc" stroke-width="1.8" opacity="0.5" class="dash-edge-1"/>

    <!-- Inter-node cross-links -->
    <line x1="1010" y1="120" x2="1110" y2="220" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="960" y1="290" x2="1110" y2="220" stroke="#818cf8" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="740" y1="100" x2="860" y2="60" stroke="#fbbf24" stroke-width="1" opacity="0.25"/>

    <!-- Animated Data Packets traveling along edges -->
    <circle class="packet-1" cx="860" cy="190" r="3" fill="#00f2fe" filter="url(#subtleGlow)"/>
    <circle class="packet-2" cx="1010" cy="120" r="2.5" fill="#34d399" filter="url(#subtleGlow)"/>
    <circle class="packet-3" cx="860" cy="190" r="2.5" fill="#c084fc" filter="url(#subtleGlow)"/>

    <!-- Node 1: Top-Left (Cookie ID) -->
    <g transform="translate(740, 100)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="url(#nodeGradGold)" filter="url(#subtleGlow)"/>
      <text x="18" y="4" fill="#fef08a" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Cookie ID</text>
    </g>

    <!-- Node 2: Bottom-Left (Household / IP) -->
    <g transform="translate(760, 280)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="url(#nodeGradPurple)" filter="url(#subtleGlow)"/>
      <text x="18" y="4" fill="#e9d5ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Household / IP</text>
    </g>

    <!-- Node 3: Top-Right (MAID / Mobile ID) -->
    <g transform="translate(1010, 120)">
      <circle class="pulse-ring-2" cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="url(#nodeGradPrimary)" filter="url(#subtleGlow)"/>
      <text x="20" y="4" fill="#bae6fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MAID / Device</text>
    </g>

    <!-- Node 4: Bottom-Right (Hashed PII / Email) -->
    <g transform="translate(960, 290)">
      <circle class="pulse-ring-3" cx="0" cy="0" r="10" fill="none" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="url(#nodeGradPrimary)" filter="url(#subtleGlow)"/>
      <text x="18" y="4" fill="#c7d2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SHA-256 PII</text>
    </g>

    <!-- Node 5: Far-Right Unified Record -->
    <g transform="translate(1110, 220)">
      <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="url(#nodeGradGreen)" filter="url(#subtleGlow)"/>
      <text x="-8" y="28" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Customer 360</text>
    </g>

    <!-- Center Hub: Golden Record / Resolved Entity (860, 190) -->
    <g transform="translate(860, 190)">
      <circle class="pulse-ring-1" cx="0" cy="0" r="14" fill="none" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="#0c1a38" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="12" fill="url(#nodeGradPrimary)"/>
      <!-- Icon: Interlocking Link / Hub -->
      <path d="M -5,-5 L 5,5 M 5,-5 L -5,5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="0" y="42" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.5">GOLDEN RECORD</text>
      <text x="0" y="56" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Resolved Entity</text>
    </g>
  </g>

  <!-- Left Header & Branding Area -->
  <g transform="translate(56, 46)">
    <!-- Top Pill / Category Biscuit -->
    <g class="badge-pulsing">
      <rect x="0" y="0" width="340" height="28" rx="14" fill="#0c1f3d" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)"/>
      <text x="26" y="18" fill="#7dd3fc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.2">IDENTITY GRAPH &amp; ENTITY RESOLUTION</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Awesome Identity</text>
      <text x="0" y="44" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Resolution Platform 🔗</text>
    </g>

    <!-- Subtitle & Value Proposition -->
    <text x="0" y="150" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14.5" font-weight="400">
      Curated directory of SaaS Customer 360s, open-source record linkage engines,
    </text>
    <text x="0" y="172" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14" font-weight="500">
      probabilistic matchers, clean rooms &amp; warehouse-native graph stitching.
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 204)">
      <!-- Badge 1: Deterministic & Probabilistic -->
      <g>
        <rect x="0" y="0" width="180" height="26" rx="6" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1"/>
        <text x="10" y="17" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎯 Deterministic &amp; Probabilistic</text>
      </g>

      <!-- Badge 2: Cross-Device Graph -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="140" height="26" rx="6" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1"/>
        <text x="10" y="17" fill="#818cf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🌐 Cross-Device Graph</text>
      </g>

      <!-- Badge 3: Privacy & Clean Rooms -->
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="165" height="26" rx="6" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1"/>
        <text x="10" y="17" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔒 Privacy &amp; Clean Rooms</text>
      </g>

      <!-- Badge 4: SaaS & Open Source -->
      <g transform="translate(515, 0)">
        <rect x="0" y="0" width="150" height="26" rx="6" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1"/>
        <text x="10" y="17" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ SaaS &amp; Open Source</text>
      </g>
    </g>
  </g>

  <!-- Corner Tech HUD Accents -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M 20,35 L 20,20 L 35,20"/>
    <path d="M 1180,35 L 1180,20 L 1165,20"/>
    <path d="M 20,345 L 20,360 L 35,360"/>
    <path d="M 1180,345 L 1180,360 L 1165,360"/>
  </g>
</svg>
