<svg xmlns="http://www.w3.org/2009/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" ry="15" />
  
  <!-- Animated Circles -->
  <circle cx="100" cy="100" r="40" fill="#ffffff" opacity="0.1">
    <animate attributeName="r" values="40;60;40" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="700" cy="100" r="60" fill="#ffffff" opacity="0.1">
    <animate attributeName="r" values="60;80;60" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Title -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    Awesome CPQ
  </text>
  
  <!-- Subtitle -->
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#e0e0e0">
    Configure, Price, Quote - SaaS &amp; Open Source
  </text>
</svg>
